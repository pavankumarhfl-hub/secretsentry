[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsentry"
version = "0.2.0"
description = "Privacy-first secret detection for source trees and CI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pavan Kumar BN"}]
keywords = ["security", "secrets", "secret-scanning", "devsecops", "github-actions", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
secretsentry = "secretsentry:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["secretsentry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
